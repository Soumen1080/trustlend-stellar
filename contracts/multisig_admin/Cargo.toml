[package]
name    = "multisig-admin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
# Transitive dependency versions are locked at the workspace level.
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Real sibling contracts so the integration tests exercise the actual
# multisig → target-contract link, not a mock.
lending = { path = "../lending", features = ["testutils"] }
default-management = { path = "../default_management", features = ["testutils"] }
borrower-reputation = { path = "../borrower_reputation", features = ["testutils"] }
